name: Check Code City

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish-artifact:
        description: Upload the verified static site for a Pages deployment.
        type: boolean
        default: false
    secrets:
      CODECITY_GITHUB_TOKEN:
        description: Optional read-only token for selected private repositories.
        required: false
      CODECITY_PRIVATE_REPOSITORIES:
        description: Optional JSON list of private repositories and public aliases.
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 257
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate the configured city
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODECITY_GITHUB_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CODECITY_GITHUB_TOKEN || '' }}
          CODECITY_PRIVATE_REPOSITORIES: ${{ github.event_name != 'pull_request' && secrets.CODECITY_PRIVATE_REPOSITORIES || '' }}
      - name: Check formatting, types, unit tests and build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile interaction
        run: npm run test:e2e -- --workers=2
      - name: Check the built site under a Pages prefix
        run: npm run test:pages -- --workers=2
      - name: Upload verified Pages artifact
        if: ${{ inputs.publish-artifact == true }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
